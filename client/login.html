<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1e4d3a">
  <title>Secret Santa — Acesso</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/plus-jakarta-sans@5.2.8/index.css"
    integrity="sha384-CriTXMxa9KSWUY4RPeIP7Xe+CI39CEWYo20uac1eZ4erQw31mZTTxvq6xZdWgidR" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/fraunces@5.2.8/index.css"
    integrity="sha384-UBknwUyCRagPAN9+nvtWtCb093nCPkOISFaGse71TTL3t2t0EqJ9O1m1TVvmH68a" crossorigin="anonymous">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg">
  <script src="./assets/js/theme.js"></script>
</head>

<body>

  <header class="topbar">
    <div class="wrap">
      <span class="brand"><span class="brand-mark"><i class="bi bi-gift-fill" aria-hidden="true"></i></span>Secret <em>Santa</em></span>
      <nav class="topbar-nav" aria-label="Principal"></nav>
    </div>
  </header>

  <main class="solo">
    <div class="solo-card">
      <div class="card card-pad">
        <div style="text-align:center;margin-bottom:24px">
          <div class="dialog-icon tone-danger"><i class="bi bi-gift-fill" aria-hidden="true"></i></div>
          <h1 class="dialog-title">Acesso restrito</h1>
          <p class="muted" style="margin-top:6px">Digite a senha para organizar um amigo secreto.</p>
        </div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="password" class="label">Senha</label>
            <div class="affix">
              <i class="bi bi-lock-fill affix-icon" aria-hidden="true"></i>
              <input type="password" id="password" name="password" class="input has-end" autocomplete="current-password"
                required autofocus placeholder="Digite a senha de acesso" aria-describedby="login-error">
              <button type="button" id="toggle-password" class="affix-end btn-ghost" style="border:0;background:none;cursor:pointer;padding:4px" aria-label="Mostrar senha" title="Mostrar senha">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <div id="login-error" class="note note-warn small" role="alert" style="margin-top:14px" hidden>
            <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i><span></span>
          </div>

          <button type="submit" id="login-submit" class="btn btn-primary btn-lg btn-block" style="margin-top:20px">
            <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>Entrar
          </button>
        </form>
      </div>

      <p class="small muted" style="text-align:center;margin-top:16px">
        <i class="bi bi-envelope-paper-heart" aria-hidden="true"></i>
        Recebeu um link por e-mail? Ele abre direto, sem precisar de senha.
      </p>
    </div>
  </main>

  <footer class="footer" style="margin-top:64px">
    <div class="wrap">
      <span class="brand"><span class="brand-mark"><i class="bi bi-gift-fill" aria-hidden="true"></i></span>Secret <em>Santa</em></span>
      <span>Organizador gratuito de amigo secreto · feito com <i class="bi bi-heart-fill" style="color:var(--berry)" aria-label="amor"></i> para o Natal</span>
    </div>
  </footer>

  <script src="./assets/js/login.js"></script>

</body>
</html>
