<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Secret Santa — Acesso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg">
  <script src="./assets/js/theme.js"></script>
</head>

<body class="login-page">

  <!-- ── Navbar ── -->
  <nav class="navbar navbar-santa navbar-expand-lg">
    <div class="container">
      <span class="navbar-brand d-flex align-items-center gap-2">
        <img src="./assets/img/logo_secret_santa.png" alt="Secret Santa">
        <span>Secret Santa</span>
      </span>
    </div>
  </nav>

  <main class="login-main">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5">
          <div class="card-santa card login-card">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <div class="modal-santa-icon modal-santa-icon-error login-icon"><i class="bi bi-gift-fill"></i></div>
                <h1 class="h4 fw-bold mt-4 mb-1">Acesso restrito</h1>
                <p class="text-muted mb-0">Digite a senha para organizar um amigo secreto.</p>
              </div>

              <form id="login-form" novalidate>
                <label for="password" class="form-label">Senha</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                  <input type="password" id="password" name="password" class="form-control" autocomplete="current-password"
                    required autofocus placeholder="Digite a senha de acesso">
                  <button type="button" id="toggle-password" class="btn btn-outline-secondary" aria-label="Mostrar senha" title="Mostrar senha">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>

                <div id="login-error" class="alert alert-danger d-flex align-items-center gap-2 mt-3 mb-0 py-2 small d-none" role="alert">
                  <i class="bi bi-exclamation-triangle-fill"></i><span></span>
                </div>

                <button type="submit" id="login-submit" class="btn btn-santa btn-santa-lg w-100 mt-4">
                  <span class="spinner-border spinner-border-sm me-2 d-none" aria-hidden="true"></span>
                  <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                </button>
              </form>
            </div>
          </div>

          <p class="text-center text-muted small mt-3 mb-0">
            <i class="bi bi-envelope-paper-heart me-1"></i>
            Recebeu um link por e-mail? Ele abre direto, sem precisar de senha.
          </p>
        </div>
      </div>
    </div>
  </main>

  <!-- ── Footer ── -->
  <footer class="footer-santa">
    <div class="container text-center">
      <p class="mb-1"><i class="bi bi-gift-fill me-1 text-danger"></i><strong class="text-white">Secret Santa</strong> — Organizador gratuito de Amigo Secreto</p>
      <p class="mb-0">Feito com <i class="bi bi-heart-fill text-danger"></i> para tornar o Natal mais especial</p>
    </div>
  </footer>

  <script src="./assets/js/login.js"></script>

</body>
</html>
